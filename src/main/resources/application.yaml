spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/restaurant-db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration
  messages:
    basename: i18n/messages
    encoding: UTF-8
custom:
  jwt:
    secret: ${JWT_SECRET:changeMeToAStrongSecret}
    expiration: ${JWT_EXPIRATION:3600} # 60 minutos
    issuer: ${JWT_ISSUER:Restaurant Project API}
springdoc:
  swagger-ui:
    path: swagger-ui.html
azure:
  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;}
    container-name: ${AZURE_STORAGE_CONTAINER_NAME:dish-images}